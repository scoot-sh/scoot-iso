name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v18
      - name: flake check (patch-consistency + module eval)
        run: nix flake check --print-build-logs
      - name: render check (patch applies to the pinned sources)
        run: |
          nix build .#checks.x86_64-linux.patch-consistency --print-build-logs
      - name: patched source check (same derivation the ISO overlays)
        run: |
          nix build .#packages.x86_64-linux.calamares-ext-patched-src -o result-patched-src --print-build-logs
      - name: patched package check (proves the source keeps the expected layout)
        run: |
          nix build .#packages.x86_64-linux.calamares-nixos-scoot --print-build-logs
      - name: "render check (installer writer matrix)"
        run: |
          sudo env PATH="$PATH" python3 tests/render_check.py result-patched-src/src/modules/nixos/main.py iso/target

  # The ONLINE ISO: the default `iso` output. CI builds it, reports its
  # size and boot-tests it; nothing is published.
  build-iso:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v18
      - name: build ISO (x86_64-linux, online)
        run: nix build .#packages.x86_64-linux.iso --print-build-logs -o result-iso
      - name: report the size
        run: |
          iso=$(echo result-iso/iso/*.iso)
          bytes=$(stat -c%s "$iso")
          echo "## Online ISO size" >> "$GITHUB_STEP_SUMMARY"
          echo "$iso: $bytes bytes ($(numfmt --to=iec "$bytes"))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: scoot-iso-x86_64-linux
          path: result-iso/iso/*.iso
          retention-days: 1

  # The OFFLINE ISO: the online one plus the reference target's closure,
  # built so qemu-test can drive a real network-cut install. Users build it
  # locally with scripts/build-iso-docker.sh --offline. Its artifact lives
  # one day, as test input only.
  build-iso-offline:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v18
      - name: free runner disk (the install writes the whole target closure)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: build ISO (x86_64-linux, offline)
        run: nix build .#packages.x86_64-linux.iso-offline --print-build-logs -o result-iso-offline
      - name: measure
        run: |
          iso=$(echo result-iso-offline/iso/*.iso)
          bytes=$(stat -c%s "$iso")
          echo "## Offline ISO size" >> "$GITHUB_STEP_SUMMARY"
          echo "$iso: $bytes bytes ($(numfmt --to=iec "$bytes"))" | tee -a "$GITHUB_STEP_SUMMARY"
          df -h / /nix | tee -a "$GITHUB_STEP_SUMMARY"
      - name: upload ISO artifact (test input only)
        uses: actions/upload-artifact@v4
        with:
          name: scoot-iso-offline-x86_64-linux
          path: result-iso-offline/iso/*.iso
          retention-days: 1

  # The documented Docker one-command build, for x86_64: runs the pinned
  # nixos/nix image, builds the ISO inside it, checks the output's
  # checksum/size. (It rebuilds rather than reusing build-iso's output:
  # the point is proving the documented command works end to end.)
  docker-build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: build ISO via Docker
        run: |
          ISO_FLAKE="github:scoot-sh/scoot-iso?ref=${{ github.sha }}" ISO_OUTDIR=docker-iso-out scripts/build-iso-docker.sh
      - name: measure the Docker-built ISO
        run: |
          iso=$(echo docker-iso-out/*.iso)
          bytes=$(stat -c%s "$iso")
          echo "## Docker ISO size" >> "$GITHUB_STEP_SUMMARY"
          echo "$iso: $bytes bytes ($(numfmt --to=iec "$bytes"))" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$iso" | tee SHA256SUMS-docker >> "$GITHUB_STEP_SUMMARY"
      - name: upload Docker-built checksum
        uses: actions/upload-artifact@v4
        with:
          name: scoot-iso-docker-checksum
          path: SHA256SUMS-docker
          retention-days: 14

  # Probe: do GitHub's standard hosted runners expose /dev/kvm once a
  # udev rule grants access? Runs on every PR in ~1 minute and gates the
  # plan to run the full QEMU install test on ubuntu-latest below.
  kvm-probe:
    runs-on: ubuntu-latest
    steps:
      - name: grant KVM access and probe
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          [ -r /dev/kvm ] && [ -w /dev/kvm ] || { echo "KVM node not readable/writable"; exit 1; }
          sudo apt-get update -y -q
          sudo apt-get install -y -q qemu-system-x86
          qemu-system-x86_64 -accel help | grep -qi kvm && echo KVM-OK

  # Full QEMU install test of the OFFLINE ISO: boots the ISO, screenshots the live session
  # and the welcome window, installs offline with the GUI-identical
  # files and the network cut, reboots into ReGreet, logs in, checks
  # scoot + bar + wallpaper via `scoot msg`, and screenshots the
  # installed desktop. Runs on every PR on ubuntu-latest: the kvm-probe
  # job above proves /dev/kvm is usable there with the udev rule.
  # aarch64 builds run on the Asahi box (never on PR CI).
  qemu-test:
    needs: [build-iso-offline, kvm-probe]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v18
      - name: free runner disk (the install writes the whole target closure)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: fetch ISO + build target files
        uses: actions/download-artifact@v4
        with:
          name: scoot-iso-offline-x86_64-linux
          path: result-iso
      - name: build target files
        run: |
          nix build '.#packages.x86_64-linux.target-flake' -o result-target-flake --print-build-logs
          nix build '.#packages.x86_64-linux.target-configuration' -o result-target-config --print-build-logs
          nix build '.#packages.x86_64-linux.target-hardware' -o result-target-hardware --print-build-logs
          find result-iso -name '*.iso'
      # The workdir is on the runner's disk (runner.temp), not /tmp: on the
      # ubuntu-26.04 image the apt step below leaves /tmp a 7.9 GB tmpfs,
      # and the install's qcow2 outgrows it (EDQUOT mid-install).
      - name: run QEMU test
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q qemu-system-x86 ovmf qemu-utils
          iso=$(find result-iso -name '*.iso' | head -1)
          echo "testing ISO: $iso ($(stat -c%s "$iso") bytes)"
          scripts/qemu-test.sh \
            --iso "$iso" \
            --target-flake "$(readlink -f result-target-flake)" \
            --target-config "$(readlink -f result-target-config)" \
            --target-hardware "$(readlink -f result-target-hardware)" \
            --workdir ${{ runner.temp }}/scoot-iso-qemu \
            --mode offline \
            --user scoot --password testpass123
      - name: disk usage at the end
        if: always()
        run: df -h / | tee -a "$GITHUB_STEP_SUMMARY"
      - name: convert screenshots (fallback, always runs)
        if: always()
        run: python3 scripts/ppm-to-png.py ${{ runner.temp }}/scoot-iso-qemu
      - name: upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoot-iso-qemu
          path: ${{ runner.temp }}/scoot-iso-qemu/*.png
          retention-days: 14

  # QEMU test of the ONLINE ISO: boots it to the
  # live session (screenshots, welcome window, desktop checks), asserts
  # the target closure is NOT on the ISO, installs the canonical system
  # with the network up (every path substituted from cache.nixos.org and
  # the scoot Cachix, every flake input fetched from GitHub), reboots
  # into ReGreet, logs in and checks scoot + bar + wallpaper.
  qemu-test-online:
    needs: [build-iso, kvm-probe]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v18
      - name: free runner disk (the install writes the whole target closure)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: fetch ISO + build target files
        uses: actions/download-artifact@v4
        with:
          name: scoot-iso-x86_64-linux
          path: result-iso
      - name: build target files
        run: |
          nix build '.#packages.x86_64-linux.target-flake' -o result-target-flake --print-build-logs
          nix build '.#packages.x86_64-linux.target-configuration' -o result-target-config --print-build-logs
          nix build '.#packages.x86_64-linux.target-hardware' -o result-target-hardware --print-build-logs
          find result-iso -name '*.iso'
      - name: run QEMU test
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q qemu-system-x86 ovmf qemu-utils
          iso=$(find result-iso -name '*.iso' | head -1)
          echo "testing ISO: $iso ($(stat -c%s "$iso") bytes)"
          scripts/qemu-test.sh \
            --iso "$iso" \
            --target-flake "$(readlink -f result-target-flake)" \
            --target-config "$(readlink -f result-target-config)" \
            --target-hardware "$(readlink -f result-target-hardware)" \
            --workdir ${{ runner.temp }}/scoot-iso-qemu-online \
            --mode online \
            --user scoot --password testpass123
      - name: disk usage at the end
        if: always()
        run: df -h / | tee -a "$GITHUB_STEP_SUMMARY"
      - name: convert screenshots (fallback, always runs)
        if: always()
        run: python3 scripts/ppm-to-png.py ${{ runner.temp }}/scoot-iso-qemu-online
      - name: upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoot-iso-qemu-online
          path: ${{ runner.temp }}/scoot-iso-qemu-online/*.png
          retention-days: 14
