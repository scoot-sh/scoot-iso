# Second scoot installer page (packagechooser@scoot-location instance):
# where the generated flake lives. Same single-select list mechanism as
# the Desktop page; the nixos module reads
# gs.value("packagechooser_scoot-location") and falls back to "home"
# when the key is unset, so this page can never brick an install.
mode: required
method: legacy

labels:
    step: "Config location"

default: home

items:
    - id: home
      packages: [ ]
      name: In my home folder (recommended)
      description: "<html>Your system config lives in <b>~/nixos-config</b>, owned by you: edit it as yourself and rebuild with <b>nh os switch</b> (or <b>nixos-rebuild switch</b>). <b>/etc/nixos</b> is a symlink to it, so every guide still works.<br/>
                    <br/>
                    Needs the user account created on the Users page.</html>"
    - id: system
      packages: [ ]
      name: System-wide in /etc/nixos
      description: "<html>Your system config lives in <b>/etc/nixos</b>, owned by root: edit it with <b>sudo</b> and rebuild with <b>sudo nixos-rebuild switch</b> (or <b>nh os switch</b>). Pick this for a shared machine.<br/>
                    <br/>
                    Both choices keep the config in a git repo with a first commit.</html>"
