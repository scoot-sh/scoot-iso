---
# Pre-partition network probe for the scoot choice (scoot-iso): decides
# whether the installer can use the normal substituters (online) or must
# install from the ISO's shipped store (offline). This instance runs
# FIRST in the exec phase (see settings.conf), before partition, and
# records the verdict in /tmp/scoot-netmode for the nixos module, which
# falls back to a live probe when the file is missing (e.g. the step
# was skipped). The verdict is data, never a job failure: the command
# always exits 0, so a dead network can never block partitioning — the
# offline path simply installs from the shipped store.
dontChroot: true
timeout: 30
verbose: true
script:
    - |
      python3 -c '
      import urllib.request
      mode = "offline"
      probes = (
          "https://cache.nixos.org/nix-cache-info",
          "https://scoot-sh.cachix.org/nix-cache-info",
      )
      for url in probes:
          try:
              if urllib.request.urlopen(url, timeout=8).read(32):
                  mode = "online"
                  break
          except Exception:
              pass
      open("/tmp/scoot-netmode", "w").write(mode + "\n")
      ' ; exit 0
i18n:
    name: "Probing network for the scoot installer"
