---
# Pre-partition network probe for the scoot choice (scoot-iso): records
# whether the substituters answer (online) or not (offline). The
# graphical install needs the network (the Welcome page requires
# internet), so offline here means the network dropped after that
# check; the nixos module then re-probes and, still offline, refuses
# before nixos-install with the missing paths (see calamares-patch.py).
# This instance runs FIRST in the exec phase (see settings.conf),
# before partition, and records the verdict in /tmp/scoot-netmode for
# the nixos module, which falls back to a live probe when the file is
# missing. The verdict is data, never a job failure:
# - any earlier verdict is removed first, so a probe that never writes
#   leaves no file and the module re-probes instead of trusting a stale
#   "online" from an earlier run in the same boot;
# - the probe is capped at 20 s (`timeout 20`): urlopen's own timeout
#   does not bound DNS resolution, and Calamares turns a shellprocess
#   timeout (30 s below) into a job error;
# - the command always exits 0.
dontChroot: true
timeout: 30
verbose: true
script:
    - |
      rm -f /tmp/scoot-netmode
      timeout 20 python3 -c '
      import urllib.request
      mode = "offline"
      probes = (
          "https://cache.nixos.org/nix-cache-info",
          "https://scoot-sh.cachix.org/nix-cache-info",
      )
      for url in probes:
          try:
              if urllib.request.urlopen(url, timeout=8).read(32):
                  mode = "online"
                  break
          except Exception:
              pass
      open("/tmp/scoot-netmode", "w").write(mode + "\n")
      ' ; exit 0
i18n:
    name: "Probing network for the scoot installer"
